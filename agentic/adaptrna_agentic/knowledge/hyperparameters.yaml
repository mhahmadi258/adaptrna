# Validated fine-tuning settings and their failure modes.
#
# Every number the ConfigRecommender proposes comes from this file, and every rationale
# line it shows the user is generated from these entries — so the explanation and the
# config can never drift apart. Each setting carries WHY it is right, which in practice
# means: what went wrong when it was different.

arms:
  lora:
    label: LoRA (frozen backbone + low-rank adapters)
    optim:
      lr: 3.0e-4
      name: adamw
    trainer:
      gradient_clip_val: 1.0
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      layer_stride: 3
    why:
      - "lr 3e-4 with gradient_clip_val 1.0 was stable across tasks (grad norms 1-2, max < 5)."
      - "layer_stride 3 adapts 11 of the 33 giga blocks and matched full fine-tuning on
         both tasks tested, at ~0.2% trainable parameters (~6 MB adapter)."
    failure_modes:
      - setting: "optim.lr = 1e-3"
        symptom: "Trains well to loss 0.126 by step ~325, then a gradient spike (norm
                  3.3e+02) collapses it into a constant-output state it never escapes:
                  |logit| -> 0.014 kills the gradient signal."
        remedy: "Use lr 3e-4 with trainer.gradient_clip_val 1.0."
      - setting: "trainer.gradient_clip_val = null"
        symptom: "A single gradient spike can collapse the adapters irrecoverably."
        remedy: "Always set gradient_clip_val for LoRA runs."

  full_ft:
    label: Full fine-tuning (whole backbone updated)
    optim:
      lr: 1.0e-5
      name: adamw
    trainer:
      gradient_clip_val: 1.0
    why:
      - "Full FT updates weights that already encode everything the pretrained model
         knows, so it needs a learning rate one to two orders of magnitude below LoRA's."
      - "A head-only warm-up schedule (ft_schedules/*.yaml) is the usual alternative to
         simply lowering the learning rate."
    failure_modes:
      - setting: "optim.lr = 1e-4 on an unfrozen backbone"
        symptom: "Destroys the pretrained backbone; MRL R^2 collapses to ~0."
        remedy: "Use lr 1e-5, or keep 1e-4 with a head-only warm-up schedule."
    artifact_note: "Full-FT exports are ~2.6 GB and cannot become served tools (only the
                    head travels in an adapter file). Prefer LoRA for anything that should
                    end up in the ToolHub."

universal:
  trainer:
    precision: bf16-mixed
  why:
    - "bf16-mixed everywhere: fp16's range is a real risk at these learning rates."
  nondeterminism:
    note: "FlashAttention's backward pass is non-deterministic (atomicAdd). Two runs of
           the same command with the same seed produced splice-site F1 95.21 and 95.82;
           407 of 436 gradient tensors differed after a single step. The forward pass IS
           deterministic, so evaluating a fixed adapter reproduces its metrics exactly."
    consequence: "Never read a small difference between two training runs as a real
                  effect. Compare arms across multiple seeds or data splits."

tasks:
  splice_site:
    primary_metric: test/f1_score
    higher_is_better: true
    metric_scale: percent
    reference:
      band: [95.8, 97.5]
      tolerance: 1.0
      sources:
        - "95.82 - published donor LoRA F1 (Spliceator benchmark)."
        - "97.48 - this repo's own donor LoRA run (Danio, db_1, 2 epochs, lr 3e-4)."
        - "95.04 - acceptor full fine-tuning, cross-task reference."
      tolerance_reason: "FlashAttention non-determinism: ±1 F1 between identical runs."
    wall_clock:
      reference: "~7 min"
      measured: "6 min 44 s for the donor LoRA run on this machine (H200, batch 32,
                 2 epochs, ~19.8k training sequences)."
    defaults:
      trainer:
        max_epochs: 2
    caveats:
      - "Cross-species benchmark: train/validate on the Spliceator folds, test on a
         different organism entirely (data.species)."
      - "Ten stratified folds (data.dataset_id db_1..db_10) make this the cheapest place
         to measure run-to-run variance."

  mrl:
    primary_metric: test/r2
    higher_is_better: true
    metric_scale: unit
    reference:
      band: [0.81, 0.83]
      tolerance: 0.02
      sources:
        - "0.8268 - published LoRA test R^2 (MAE 0.3562)."
        - "0.8187 - published full fine-tuning test R^2 (MAE 0.3698)."
      tolerance_reason: "Run-to-run variance from non-deterministic training."
    wall_clock:
      reference: "~5h45m (LoRA) / ~6h41m (full FT)"
      measured: "single H200, batch 64, 51 epochs."
    defaults:
      trainer:
        max_epochs: 50
    caveats:
      - "data.val_split=random7600 is the dataset's own evaluation split AND a reported
         result. This is safe as shipped only because nothing selects on validation (the
         final epoch is what gets tested; there is no monitored checkpoint). Adding early
         stopping or best-checkpoint selection REQUIRES switching to
         data.val_split=holdout first, or a headline metric is silently contaminated."
      - "The target scaler is fitted at on_fit_start and travels inside the adapter file;
         predictions depend on it."

  sec_struct:
    primary_metric: test/f1
    higher_is_better: true
    metric_scale: unit
    reference:
      band: null
      tolerance: 0.02
      sources: ["No in-repo reference run yet."]
      tolerance_reason: "Run-to-run variance from non-deterministic training."
    wall_clock:
      reference: "hours (one structure per step; the head is O(L^2))"
      measured: null
    defaults:
      trainer:
        max_epochs: 25
    caveats:
      - "The datamodule feeds one structure at a time - there is no batch size to set."
      - "This is the one shipped task whose validation set is genuinely load-bearing: a
         tuned threshold is re-fitted on it and travels in the adapter file."
