[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptrna-agentic"
version = "0.1.0"
description = "AdaptRNA agent platform: conversational layer over the fine-tuning engine."
requires-python = ">=3.10"
keywords = ["RNA", "Agents", "LangGraph", "LLM"]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain>=1.0",
    "langchain-anthropic",
    "python-dotenv",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# Deliberately absent: any dependency on the engine (rinalmo / rinalmo_hub), torch or
# lightning. This package must import and test in milliseconds; the engine dependency
# arrives in Phase 2, when the ToolHub actually needs RiNALMoHub.
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = [
    "adaptrna_agentic",
    "adaptrna_agentic.agents",
    "adaptrna_agentic.api",
    "adaptrna_agentic.api.routers",
    "adaptrna_agentic.cli",
    "adaptrna_agentic.jobs",
    "adaptrna_agentic.knowledge",
    "adaptrna_agentic.profiling",
    "adaptrna_agentic.toolhub",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
