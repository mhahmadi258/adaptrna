name: failure_paths
description: |
  Every failure returns something the model can act on, and none of them kill the turn.
tools: [demo_binary, dummy]
turns:
  - user: Use a tool that does not exist.
    script:
      - tool_calls: [{name: no_such_tool, args: {}}]
      - text: That tool does not exist.
    expect_tools: [no_such_tool]
    expect_tool_result_contains: [Unknown tool, list_tools]
  - user: Show me details of a tool that is not registered.
    script:
      - tool_calls: [{name: tool_info, args: {name: banana}}]
      - text: There is no such tool.
    expect_tools: [tool_info]
    expect_tool_result_contains: [Known tools]
  - user: Start training with hyperparameters you chose yourself.
    script:
      - tool_calls:
          - name: start_training
            args: {plan: {task: demo_binary, arm: lora, command: [echo], overrides: {optim.lr: 0.001}}}
      - text: I cannot invent hyperparameters.
    expect_interrupt: true
    resume: {approved: true}
    expect_tool_result_contains: [recommend_training_config, knowledge base]
    expect_no_jobs_after: true
