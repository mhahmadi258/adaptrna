name: management
description: |
  Flow B. Tool state belongs to the user (Phase 10 §1, reversing Phase 4's
  activate-and-use-in-one-turn). Every toggle suspends at the approval gate; a disabled
  tool refuses with a message that does *not* tell the model to fix it itself; declining
  an activation leaves the tool off — the bug this flow exists to catch.
tools: [splice_site, dummy]
turns:
  - user: Turn off dummy_add, then try to use it.
    script:
      - tool_calls: [{name: deactivate_tool, args: {name: dummy_add}}]
      - tool_calls: [{name: dummy_add, args: {a: 2, b: 3}, id: call_2}]
      - text: It is disabled; shall I ask you to re-enable it?
    expect_interrupt: true
    resume: {approved: true}
    expect_tools: [deactivate_tool, dummy_add]
    expect_tool_result_contains: ["Only the user can enable it"]
    expect_state: {dummy_add: disabled}

  - user: Re-enable it and add 2 and 3.
    script:
      - tool_calls: [{name: activate_tool, args: {name: dummy_add}}]
      - text: Left it off, as you asked.
    expect_interrupt: true
    resume: {approved: false, note: not yet}
    expect_tools: [activate_tool]
    expect_tool_result_contains: [declined]
    # The whole point: a decline does not flip the switch.
    expect_state: {dummy_add: disabled}

  - user: Actually yes, re-enable it and add 2 and 3.
    script:
      - tool_calls: [{name: activate_tool, args: {name: dummy_add}}]
      - tool_calls: [{name: dummy_add, args: {a: 2, b: 3}, id: call_3}]
      - text: 2 + 3 = 5.
    expect_interrupt: true
    resume: {approved: true}
    expect_tools: [activate_tool, dummy_add]
    expect_tool_result_contains: ['"total": 5.0']
    expect_state: {dummy_add: active}
