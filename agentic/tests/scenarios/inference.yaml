name: inference
description: |
  Flow A. The user asks what exists, then asks for a prediction. The adapter tool runs on
  the shared backbone and the loop terminates on the tool-free answer.
tools: [demo_binary, dummy]
turns:
  - user: What tools are available?
    script:
      - tool_calls: [{name: list_tools, args: {}}]
      - text: You have a demo binary-classification adapter and two dummy tools.
    expect_tools: [list_tools]
    expect_tool_result_contains: [demo_binary, dummy_add]
  - user: What does GGCAUUACGGCUUAAGCUAGCUAGCUAAGGCC score?
    script:
      - tool_calls:
          - name: demo_binary
            args: {sequences: [GGCAUUACGGCUUAAGCUAGCUAGCUAAGGCC]}
      - text: The probability is reported above.
    expect_tools: [demo_binary]
    expect_probabilities: true
