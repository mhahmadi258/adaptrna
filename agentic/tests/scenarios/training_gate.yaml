name: training_gate
description: |
  Flow C's gate. start_training must not run before approval, and a denial must leave no
  job behind — the property that matters more than any other in this project.
tools: [demo_binary]
turns:
  - user: Train the model and start it now.
    script:
      - tool_calls:
          - name: start_training
            args: {plan: {task: demo_binary, arm: lora}}
      - text: I have stopped at the approval gate.
    expect_interrupt: true
    expect_no_jobs: true
    resume: {approved: false, note: not now}
    expect_tool_result_contains: [declined]
    expect_no_jobs_after: true
