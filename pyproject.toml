[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rinalmo-hub"
version = "0.1.0"
description = "One frozen RiNALMo backbone, swappable LoRA adapters and task heads."
requires-python = ">=3.10"
keywords = ["RNA", "Biology", "Deep Learning", "LoRA", "LLM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.5",
    "ml_collections>=0.1.1",
    "peft>=0.11.0",
    "lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "einops>=0.6.0",
    "PyYAML>=6.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "gdown>=5.1.0",
    "requests",
    "tqdm",
]

# `flash_attn` is a CUDA-only build and is imported lazily: training and evaluation on GPU
# want it, the CPU test suite does not need it. Install it separately, matched to your
# torch/CUDA build.
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = [
    "rinalmo",
    "rinalmo.data",
    "rinalmo.data.downstream",
    "rinalmo.data.downstream.ribosome_loading",
    "rinalmo.data.downstream.secondary_structure",
    "rinalmo.data.downstream.splice_site_prediction",
    "rinalmo.model",
    "rinalmo.utils",
    "rinalmo_hub",
    "rinalmo_hub.cli",
    "rinalmo_hub.data",
    "rinalmo_hub.tasks",
]
include-package-data = true

[tool.setuptools.package-data]
"rinalmo" = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The default run is the CPU-only subset: a randomly-initialised `nano` model, no weights,
# no datasets, seconds. Opt into the rest with e.g. `pytest -m gpu`.
addopts = "-ra -m 'not gpu and not weights and not data'"
markers = [
    "gpu: needs a CUDA device (not run at build time)",
    "weights: needs the pretrained giga-v1.pt backbone (not run at build time)",
    "data: needs a downloaded dataset (not run at build time)",
]
