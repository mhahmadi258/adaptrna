<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaptRNA</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧬</text></svg>">
</head>
<body>

<header class="topbar">
  <button id="rail-toggle" class="btn btn-quiet rail-toggle" type="button"
          aria-controls="rail" aria-expanded="true" title="Show or hide the session list">☰</button>
  <div class="brand">Adapt<span>RNA</span></div>
  <!-- Hidden unless it has something to report: a degraded install, or a server that has
       gone away. `refreshHealth` unhides it, and it is the way to the doctor report. -->
  <button id="health" class="badge" type="button" hidden></button>
</header>

<main class="layout">

  <nav id="activity" class="activity" role="tablist" aria-label="Views">
    <button id="activity-sessions" class="activity-btn" type="button" role="tab"
            aria-controls="rail" aria-selected="true" title="Sessions">💬</button>
    <button id="activity-jobs" class="activity-btn" type="button" role="tab"
            aria-controls="rail" aria-selected="false" title="Training runs">⏱<span
            id="activity-dot" class="activity-dot" hidden></span></button>
  </nav>

  <aside class="rail" id="rail" aria-label="Sessions">
    <div class="rail-head">
      <button id="rail-new" class="btn btn-primary rail-new" type="button">＋ New session</button>
      <input id="rail-filter" class="rail-filter" type="search" placeholder="Filter sessions…"
             aria-label="Filter sessions">
    </div>
    <div id="rail-list" class="rail-list"></div>
    <div id="rail-grip" class="rail-grip" role="separator" aria-orientation="vertical"
         aria-label="Resize the session list" tabindex="0"></div>
  </aside>

  <!-- Exactly one of these two is on screen: a conversation, or a run's log. The chat is
       never torn down, so a turn keeps streaming into it while a log is being read. -->
  <div class="center">
    <section id="chat" class="chat" aria-label="Chat">
      <div id="chat-log" class="chat-log"></div>
      <div id="thinking" class="thinking" hidden><span></span><span></span><span></span></div>
      <div class="composer">
        <textarea id="composer-input" rows="1" placeholder="Ask about your data, your tools, or a fine-tune…"></textarea>
        <button id="composer-send" class="btn btn-primary" type="button">Send</button>
      </div>
    </section>

    <section id="joblog" class="joblog" aria-label="Job log" hidden>
      <header id="joblog-head" class="joblog-head"></header>
      <pre id="joblog-body" class="joblog-body" tabindex="0"></pre>
    </section>
  </div>

  <aside class="side" aria-label="Tools">
    <section class="panel">
      <h2>Tools</h2>
      <div id="tools-list" class="panel-list"></div>
    </section>

    <section id="inspector" class="panel inspector" hidden>
      <h2>
        <span id="inspector-title"></span>
        <button id="inspector-close" class="btn btn-quiet" type="button" title="Close">×</button>
      </h2>
      <div id="inspector-body"></div>
    </section>
  </aside>

</main>

<div id="approval" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="approval-heading">
  <div class="modal">
    <h2 id="approval-heading">Approval required</h2>
    <div id="approval-body"></div>
    <label class="approval-note-label" for="approval-note">note (optional)</label>
    <input id="approval-note" type="text" placeholder="why, if you are declining">
    <div class="modal-actions">
      <button id="approval-decline" class="btn" type="button">Decline</button>
      <button id="approval-approve" class="btn btn-primary" type="button">Approve</button>
    </div>
  </div>
</div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
