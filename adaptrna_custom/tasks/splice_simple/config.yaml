# splice_simple: binary donor splice-site classification from flat CSVs.
# Layered on top of engine/configs/base.yaml.

task: splice_simple
lm_config: giga

head:
  head_embed_dim: 128
  dropout: 0.1
  threshold: 0.5              # decision threshold; shipped in the adapter payload

data:
  root: dod_data
  train_file: splice_simple_train.csv
  val_file: splice_simple_val.csv
  test_file: splice_simple_test.csv
  sequence_column: sequence
  label_column: label
  batch_size: 32
  num_workers: 8
  pin_memory: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  layer_stride: 3
  target_modules: [mh_attn.Wqkv, mh_attn.out_proj]

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  scheduler:
    name: none

trainer:
  max_epochs: 10
  precision: bf16-mixed
  gradient_clip_val: 1.0
